<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tennis Simulator (Standalone)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <style>
        :root {
            --pico-primary: #3b82f6;
        }
        body {
            padding-top: 1rem;
        }
        nav {
            margin-bottom: 2rem;
        }
        .hero {
            text-align: center;
            padding: 1rem 0;
            border-bottom: 1px solid var(--pico-muted-border-color);
            margin-bottom: 2rem;
        }
        article header {
            margin-bottom: 1rem;
        }
        input[type="range"] {
            margin-bottom: 0.25rem;
        }
        .val-display {
            display: block;
            font-size: 0.8rem;
            color: var(--pico-muted-color);
            margin-bottom: 0.5rem;
        }
        .slider-scale {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: var(--pico-muted-color);
            margin-bottom: 1rem;
            padding: 0 5px;
        }
        #win_progress {
            height: 1.5rem;
            margin-bottom: 0.5rem;
        }
        .results-box {
            display: none;
            margin-top: 2rem;
        }
        .sim-control {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .sim-arrows {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .sim-arrow-btn {
            padding: 0 0.5rem;
            font-size: 0.8rem;
            line-height: 1;
            height: 22px;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .theme-toggle-container {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <main class="container">
        <div class="theme-toggle-container">
            <button class="outline" onclick="toggleTheme()" id="theme_btn">☀️ </button>
        </div>

        <div class="hero">
            <h1>🎾 Tennis Simulator</h1>
            <p>Standalone client-side simulation based on momentum and skill modifiers.</p>
        </div>

        <div class="grid">
            <div>
                <article>
                    <header><strong>Player A Settings</strong></header>
                    <label for="a_base_p">Serve Win Prob (%)
                        <input type="range" id="a_base_p" min="0" max="100" value="50" oninput="updateVal('a_base_p')">
                        <span id="a_base_p_val" class="val-display">50%</span>
                        <div class="slider-scale"><span>0%</span><span>25%</span><span>50%</span><span>75%</span><span>100%</span></div>
                    </label>
                    <label for="a_streak_adv">Streak Modifier (%)
                        <input type="range" id="a_streak_adv" min="-10" max="10" value="0" step="0.5" oninput="updateVal('a_streak_adv')">
                        <span id="a_streak_adv_val" class="val-display">0%</span>
                        <div class="slider-scale"><span>-10%</span><span>-5%</span><span>0%</span><span>5%</span><span>10%</span></div>
                    </label>
                    <label for="a_pressure_adv">Pressure Modifier (%)
                        <input type="range" id="a_pressure_adv" min="-10" max="10" value="0" step="0.5" oninput="updateVal('a_pressure_adv')">
                        <span id="a_pressure_adv_val" class="val-display">0%</span>
                        <div class="slider-scale"><span>-10%</span><span>-5%</span><span>0%</span><span>5%</span><span>10%</span></div>
                    </label>
                </article>
            </div>
            <div>
                <article>
                    <header><strong>Player B Settings</strong></header>
                    <label for="b_base_p">Serve Win Prob (%)
                        <input type="range" id="b_base_p" min="0" max="100" value="50" oninput="updateVal('b_base_p')">
                        <span id="b_base_p_val" class="val-display">50%</span>
                        <div class="slider-scale"><span>0%</span><span>25%</span><span>50%</span><span>75%</span><span>100%</span></div>
                    </label>
                    <label for="b_streak_adv">Streak Modifier (%)
                        <input type="range" id="b_streak_adv" min="-10" max="10" value="0" step="0.5" oninput="updateVal('b_streak_adv')">
                        <span id="b_streak_adv_val" class="val-display">0%</span>
                        <div class="slider-scale"><span>-10%</span><span>-5%</span><span>0%</span><span>5%</span><span>10%</span></div>
                    </label>
                    <label for="b_pressure_adv">Pressure Modifier (%)
                        <input type="range" id="b_pressure_adv" min="-10" max="10" value="0" step="0.5" oninput="updateVal('b_pressure_adv')">
                        <span id="b_pressure_adv_val" class="val-display">0%</span>
                        <div class="slider-scale"><span>-10%</span><span>-5%</span><span>0%</span><span>5%</span><span>10%</span></div>
                    </label>
                </article>
            </div>
        </div>

        <article>
            <header><strong>Match Configuration</strong></header>
            <div class="grid">
                <label for="set_limit">Sets to Win
                    <select id="set_limit">
                        <option value="2">Best of 3 (Win 2)</option>
                        <option value="3">Best of 5 (Win 3)</option>
                    </select>
                </label>
                <div>
                    <label for="sim_count">Number of Simulations</label>
                    <div class="sim-control">
                        <input type="number" id="sim_count" value="10000" min="1" max="1000000" 
                               onkeydown="if(event.key==='ArrowUp'){event.preventDefault();adjustSims(10);}else if(event.key==='ArrowDown'){event.preventDefault();adjustSims(0.1);}">
                        <div class="sim-arrows">
                            <button class="sim-arrow-btn contrast" onclick="adjustSims(10)" title="Increase 10x">▲</button>
                            <button class="sim-arrow-btn contrast" onclick="adjustSims(0.1)" title="Decrease 10x">▼</button>
                        </div>
                    </div>
                </div>
            </div>
            <button onclick="runSimulations()" id="sim_btn">Run Simulation</button>
        </article>

        <div id="results_container" class="results-box">
            <article>
                <header><strong>Simulation Results</strong></header>
                <div id="summary_text" style="font-size: 1.2rem; text-align: center; margin-bottom: 1rem;"></div>
                <progress id="win_progress" value="0" max="100"></progress>
            </article>
        </div>
    </main>

    <script>
        function updateVal(id) {
            document.getElementById(id + '_val').textContent = document.getElementById(id).value + '%';
        }

        function adjustSims(factor) {
            const input = document.getElementById('sim_count');
            let val = parseInt(input.value) || 10000;
            val = Math.round(val * factor);
            if (val < 1) val = 1;
            if (val > 1000000) val = 1000000;
            input.value = val;
        }

        function toggleTheme() {
            const html = document.documentElement;
            const current = html.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', next);
            document.getElementById('theme_btn').textContent = next === 'dark' ? '☀️' : '🌙';
        }

        function runSimulations() {
            const simCount = parseInt(document.getElementById('sim_count').value);
            const setLimit = parseInt(document.getElementById('set_limit').value);
            
            const config = {
                a: {
                    base_p: parseInt(document.getElementById('a_base_p').value) / 100,
                    streak_adv: parseFloat(document.getElementById('a_streak_adv').value) / 100,
                    pressure_adv: parseFloat(document.getElementById('a_pressure_adv').value) / 100
                },
                b: {
                    base_p: parseInt(document.getElementById('b_base_p').value) / 100,
                    streak_adv: parseFloat(document.getElementById('b_streak_adv').value) / 100,
                    pressure_adv: parseFloat(document.getElementById('b_pressure_adv').value) / 100
                },
                setLimit: setLimit
            };

            let aWins = 0;
            const btn = document.getElementById('sim_btn');
            btn.disabled = true;
            btn.textContent = 'Simulating...';

            setTimeout(() => {
                const startTime = performance.now();
                for (let i = 0; i < simCount; i++) {
                    if (simulateMatch(config)) aWins++;
                }
                const endTime = performance.now();
                console.log(`Simulation took ${Math.round(endTime - startTime)}ms`);

                const winRate = (aWins / simCount * 100).toFixed(1);
                document.getElementById('results_container').style.display = 'block';
                document.getElementById('summary_text').innerHTML = `Player A won <strong>${aWins.toLocaleString()}</strong> out of <strong>${simCount.toLocaleString()}</strong> matches (<strong>${winRate}%</strong>)`;
                document.getElementById('win_progress').value = winRate;
                
                btn.disabled = false;
                btn.textContent = 'Run Simulation';
                document.getElementById('results_container').scrollIntoView({ behavior: 'smooth' });
            }, 50);
        }

        function simulateMatch(config) {
            let aSets = 0, bSets = 0;
            let aServing = Math.random() < 0.5;

            while (aSets < config.setLimit && bSets < config.setLimit) {
                const setWinner = simulateSet(config, aServing);
                if (setWinner === 'a') aSets++; else bSets++;
                aServing = !aServing; 
            }
            return aSets === config.setLimit;
        }

        function simulateSet(config, initialService) {
            let aGames = 0, bGames = 0;
            let aServing = initialService;

            while (true) {
                if (aGames >= 6 && aGames - bGames >= 2) return 'a';
                if (bGames >= 6 && bGames - aGames >= 2) return 'b';
                if (aGames === 6 && bGames === 6) return simulateTiebreaker(config, aServing);

                const gameWinner = simulateGame(config, aServing, aGames, bGames);
                if (gameWinner === 'a') aGames++; else bGames++;
                aServing = !aServing;
            }
        }

        function simulateGame(config, aServing, aGames, bGames) {
            let aPoints = 0, bPoints = 0;
            let aStreak = 0, bStreak = 0;

            while (true) {
                if (aPoints >= 4 && aPoints - bPoints >= 2) return 'a';
                if (bPoints >= 4 && bPoints - aPoints >= 2) return 'b';

                let aPressure = 0, bPressure = 0;
                if (bPoints >= 3 && bPoints > aPoints) aPressure = 1;
                if (aPoints >= 3 && aPoints > bPoints) bPressure = 1;

                let pA;
                if (aServing) {
                    pA = config.a.base_p + (aStreak * config.a.streak_adv) - (bStreak * config.b.streak_adv) + (aPressure * config.a.pressure_adv);
                } else {
                    pA = 1 - (config.b.base_p + (bStreak * config.b.streak_adv) - (aStreak * config.a.streak_adv) + (bPressure * config.b.pressure_adv));
                }

                if (Math.random() < pA) {
                    aPoints++; aStreak++; bStreak = 0;
                } else {
                    bPoints++; bStreak++; aStreak = 0;
                }
            }
        }

        function simulateTiebreaker(config, initialService) {
            let aPoints = 0, bPoints = 0;
            let aServing = initialService;
            let pointsInService = 0;

            while (true) {
                if (aPoints >= 7 && aPoints - bPoints >= 2) return 'a';
                if (bPoints >= 7 && bPoints - aPoints >= 2) return 'b';

                let pA = aServing ? config.a.base_p : (1 - config.b.base_p);
                if (Math.random() < pA) aPoints++; else bPoints++;

                pointsInService++;
                if (pointsInService === 1 || (pointsInService > 1 && pointsInService % 2 === 1)) {
                    aServing = !aServing;
                }
            }
        }
    </script>
